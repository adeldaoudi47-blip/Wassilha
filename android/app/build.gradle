apply plugin: 'com.android.application'

// SINGLE SOURCE OF TRUTH for the shipped version.
//
// `versionName` used to be hard-coded here while the server's `minVersion`
// (src/app/api/version/route.ts) and the web bundle's version
// (NEXT_PUBLIC_APP_VERSION, read from package.json by next.config.ts) came from
// their own places. Nothing forced them to agree, so bumping one and forgetting
// the other shipped a build that the server considered "too old" — the user
// downloads the APK, installs it, and is STILL shown the force-update modal,
// with no way out of the loop.
//
// Reading package.json here means `npm version`/`git tag` moves all three in
// lockstep. A missing/unreadable package.json falls back to a literal so the
// Android build never hard-fails on a packaging concern.
def appVersionName = "1.1.0"
try {
    def pkgFile = file('../../package.json')
    if (pkgFile.exists()) {
        def parsed = new groovy.json.JsonSlurper().parseText(pkgFile.text)
        def v = parsed?.version?.toString()?.trim()
        if (v ==~ /\d+(\.\d+){0,2}/) {
            appVersionName = v
        } else {
            logger.warn("wassilha: package.json version '${v}' is not a valid x.y.z — using fallback ${appVersionName}")
        }
    } else {
        logger.warn("wassilha: package.json not found at ${pkgFile} — using fallback ${appVersionName}")
    }
} catch (Exception e) {
    logger.warn("wassilha: could not read package.json (${e.message}) — using fallback ${appVersionName}")
}

android {
    namespace = "dz.wassilha.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dz.wassilha.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Bump this on EVERY release. Android refuses an install whose
        // versionCode is not strictly greater than the installed one, so
        // shipping a new APK without incrementing it makes the update a no-op
        // for users who already have the app. It is intentionally manual
        // (unlike versionName) because it must also increase for
        // rebuilds that did not change the marketing version.
        versionCode 2
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Signing material lives in the android/app/ dir alongside this
            // file. The store/key passwords are read from Gradle properties
            // (signing.properties or -P flags) so that the keystore + creds
            // never have to be hard-coded in the repository.
            //
            // Default values match the locally generated dev keystore; in
            // CI / Vercel / a real release pipeline these should be
            // overridden via:
            //   echo "storeFile=wassilha-release.keystore"  > android/app/signing.properties
            //   echo "storePassword=..."                    >> android/app/signing.properties
            //   echo "keyAlias=wassilha"                    >> android/app/signing.properties
            //   echo "keyPassword=..."                      >> android/app/signing.properties
            // and the file should be excluded from VCS.
            def signingProps = new Properties()
            def signingPropsFile = file('signing.properties')
            if (signingPropsFile.exists()) {
                signingProps.load(new FileInputStream(signingPropsFile))
            }
            storeFile     file(signingProps.getProperty('storeFile',     'wassilha-release.keystore'))
            storePassword signingProps.getProperty('storePassword', 'wassilha-release-2026')
            keyAlias      signingProps.getProperty('keyAlias',      'wassilha')
            keyPassword   signingProps.getProperty('keyPassword',   'wassilha-release-2026')
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
